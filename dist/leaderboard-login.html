<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Unlock leaderboard — MindTech Arena</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/fonts.css"><link rel="stylesheet" href="/style.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.access-card{width:min(100%,460px);padding:36px;border:1px solid #45433e;background:#191918}.access-card h1{font-size:clamp(32px,7vw,48px);line-height:1.1;margin:20px 0}.access-card p{color:#bbb9b3;margin-bottom:24px}.access-card label{display:block;margin-bottom:10px}.access-card input{width:100%;padding:14px;background:#111;color:#fff;border:1px solid #777;font:inherit;margin-bottom:18px}.access-card button{width:100%;padding:15px;border:0;background:#e84936;color:#fff;font:inherit;font-weight:700;cursor:pointer}.access-card a{display:inline-block;margin-top:24px;color:#bbb9b3}.access-card .error{color:#ff998e;margin-bottom:16px}</style></head>
<body><main class="access-card"><img src="/assets/mindquest-logo.jpg" width="64" height="64" alt="MindQuest"><h1>THE ARENA.<br>ADMIN ACCESS.</h1><p>Enter the organiser password to view team rankings and manage scores.</p><p class="error" id="login-error" role="alert" hidden>Incorrect password. Please try again.</p><form action="/leaderboard/login" method="post"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus maxlength="512"><button type="submit">Unlock leaderboard ↗</button></form><a href="/">← Back to the event</a></main><script>document.getElementById('login-error').hidden = !new URLSearchParams(location.search).has('error');</script></body></html>
