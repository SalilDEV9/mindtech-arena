name: Round Two reliability tests
on:
  push:
    branches: [round-two]
    paths: ['round-two/**', '.github/workflows/round-two-tests.yml']
  pull_request:
    paths: ['round-two/**', '.github/workflows/round-two-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: round-two
    env:
      MONGOMS_DOWNLOAD_IGNORE_MISSING_HEADER: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: round-two/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:http
      - name: Real MongoDB replica-set integration and concurrency tests
        run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
